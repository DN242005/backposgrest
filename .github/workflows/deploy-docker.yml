name: deploy-pg-api

on:
  push:
    branches: ["master"]

jobs:
  deploy-pg-api:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🧰 Setup de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📂 Comandos iniciales
        run: |
          echo 'hello world ...'
          ls -la

      - name: 📝 Crear archivo .env
        run: |
          touch .env
          echo "DEV_DATABASE_URL=${{ secrets.PG_CONN }}" >> .env
          cat .env

      - name: 🏗️ Build de imagen Docker
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/pg-restapi:${{ github.sha }} .

      - name: 🖼️ Mostrar imágenes Docker
        run: docker images

      - name: 🔐 Login a Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin

      - name: 🚀 Push a Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/pg-restapi:${{ github.sha }}
